<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#07061a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Neon Swarm</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="game"></canvas>

<div id="hud" class="hidden">
  <div id="xpbar"><i id="xpfill"></i></div>
  <div class="hudrow">
    <div class="hudl"><div id="hpbar"><i id="hpfill"></i><span id="hptxt"></span></div><div id="lvl">LV 1</div></div>
    <div id="timer">0:00</div>
    <button id="pausebtn" aria-label="Pause">❚❚</button>
  </div>
  <div class="hudrow2"><span id="kills">☠ 0</span><span id="coins">🪙 0</span></div>
  <div id="bossbar" class="hidden"><i id="bossfill"></i><span>BOSS</span></div>
</div>

<div id="screen"></div>
<div id="modal"></div>
<div id="banner"></div>
<div id="toast"></div>
<div id="adlayer"></div>
<div id="rotate">Please rotate your phone to portrait 📱</div>

<script src="js/config.js"></script>
<script src="js/save.js"></script>
<script src="js/audio.js"></script>
<script src="js/ads.js"></script>
<script src="js/data.js"></script>
<script src="js/game.js"></script>
<script src="js/ui.js"></script>
<script>
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
